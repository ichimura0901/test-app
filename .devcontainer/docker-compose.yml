version: '3.8'

services:
  python-dev:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
      target: development
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ../:/app # 現在のディレクトリをコンテナの/appにマウント
    tty: true

  postgres:
    image: postgres:14
    volumes:
      - postgres-data:/var/lib/postgresql/data # データの永続化
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5432:5432" # ホストマシンのポートをコンテナにマッピング

secrets:
  db_password:
    file: password.txt
  
volumes:
  postgres-data: # データボリュームの定義